---
apiVersion: v1
kind: ConfigMap
metadata: {name: cache-svc-mc-code, namespace: sc-eval}
data:
  app.py: |
    PLACEHOLDER
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache-svc-mc
  namespace: sc-eval
  labels: {app: cache-svc-mc, sc-deployment: cache-svc-mc}
spec:
  replicas: 3
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 0, maxUnavailable: 1}}
  selector: {matchLabels: {app: cache-svc-mc}}
  template:
    metadata:
      labels: {app: cache-svc-mc, sc-deployment: cache-svc-mc, sc-version: v1}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh","-c"]
          args:
            - |
              pip install --quiet --no-cache-dir flask pymemcache 2>/dev/null
              exec python3 /code/app.py
          env:
            - {name: CACHE_HOST, value: "127.0.0.1"}
            - {name: CACHE_PORT, value: "11211"}
            - {name: BACKEND_MS, value: "200"}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 2
            failureThreshold: 30
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh","-c","sleep 25"]
          volumeMounts: [{name: code, mountPath: /code}]
        - name: memcached
          image: memcached:1.6-alpine
          imagePullPolicy: IfNotPresent
          args: ["-m","8","-t","2","-p","11211","-l","0.0.0.0"]
          ports: [{containerPort: 11211}]
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh","-c","sleep 25"]
      volumes:
        - {name: code, configMap: {name: cache-svc-mc-code}}
---
apiVersion: v1
kind: Service
metadata: {name: cache-svc-mc, namespace: sc-eval}
spec:
  type: ClusterIP
  selector: {app: cache-svc-mc}
  ports: [{port: 80, targetPort: 8080}]

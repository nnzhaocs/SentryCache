---
apiVersion: v1
kind: ConfigMap
metadata: {name: cache-svc-code, namespace: sc-eval}
data:
  app.py: |
    PLACEHOLDER
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache-svc
  namespace: sc-eval
  labels: {app: cache-svc, sc-deployment: cache-svc}
spec:
  replicas: 3
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 0, maxUnavailable: 1}}
  selector: {matchLabels: {app: cache-svc}}
  template:
    metadata:
      labels: {app: cache-svc, sc-deployment: cache-svc, sc-version: v1}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh","-c"]
          args:
            - |
              pip install --quiet --no-cache-dir flask redis 2>/dev/null
              exec python3 /code/app.py
          env:
            - {name: REDIS_HOST, value: "127.0.0.1"}
            - {name: REDIS_PORT, value: "6379"}
            - {name: BACKEND_MS, value: "200"}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 2
            failureThreshold: 30
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh","-c","sleep 25"]
          volumeMounts: [{name: code, mountPath: /code}]
        - name: redis
          image: redis:7.2-alpine
          imagePullPolicy: IfNotPresent
          args: ["--maxmemory","8mb","--maxmemory-policy","allkeys-lfu","--save","","--appendonly","no","--bind","0.0.0.0","--protected-mode","no"]
          ports: [{containerPort: 6379, name: redis}]
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh","-c","sleep 25"]
      volumes:
        - {name: code, configMap: {name: cache-svc-code}}
---
apiVersion: v1
kind: Service
metadata: {name: cache-svc, namespace: sc-eval}
spec:
  type: ClusterIP
  selector: {app: cache-svc}
  ports: [{port: 80, targetPort: 8080}]
